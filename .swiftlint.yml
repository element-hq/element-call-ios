disabled_rules:
  - trailing_whitespace
  - unused_setter_value
  - redundant_discardable_let
  - identifier_name
  - void_function_in_ternary

opt_in_rules:
  - force_unwrapping
  - private_action
  - explicit_init
  - shorthand_optional_binding
  - trailing_closure

included:
  - Sources
  - Tests
excluded:
  - "Sources/*/Generated"
  - "Tests/*/Generated"

line_length:
  warning: 250
  error: 1000

file_length:
  warning: 2000

type_name:
  min_length: 3
  max_length:
    warning: 150
    error: 1000

type_body_length:
  warning: 1000
  error: 1000

function_body_length:
  warning: 100
  error: 100

function_parameter_count:
  warning: 10
  error: 10

cyclomatic_complexity:
  ignores_case_statements: true

nesting:
  type_level:
    warning: 5

custom_rules:
  vstack_spacing:
    regex: "(?-s)VStack((?!spacing:).)*\\s*\\{"
    match_kinds: identifier
    message: "Please use explicit spacing in VStacks."
    severity: warning

  hstack_spacing:
    regex: "(?-s)HStack((?!spacing:).)*\\s*\\{"
    match_kinds: identifier
    message: "Please use explicit spacing in HStacks."
    severity: warning

  # This package has no app logger. Everything goes through the injected
  # ElementCallLogging port so the host decides where logs land.
  print_deprecation:
    regex: "\\b(print)\\b"
    match_kinds: identifier
    message: "The injected ElementCallLogging port should be used instead of print()"
    severity: error

  print_ln_deprecation:
    regex: "\\b(println)\\b"
    match_kinds: identifier
    message: "The injected ElementCallLogging port should be used instead of println()"
    severity: error

  os_log_deprecation:
    regex: "\\b(os_log)\\b"
    match_kinds: identifier
    message: "The injected ElementCallLogging port should be used instead of os_log()"
    severity: error

  # The design system stays on the host's side of the boundary: see the theme
  # and icon ports. A Compound import here would give a Pro customer a call
  # screen that ignores their brand colour.
  no_compound_dependency:
    regex: "import Compound$"
    message: "The Compound component library must not be imported: its colours live on a shared instance the host re-brands at runtime. Take colours through ElementCallTheme and icons through ElementCallIconRendering. CompoundDesignTokens is fine."
    severity: error

  # Per-module, not package-wide. ElementCallMatrix exists to speak to the SDK, so
  # the rule would protect nothing there. It earns its keep in the media, lifecycle
  # and view modules, where an SDK dependency would be pure coupling.
  no_matrix_sdk_dependency:
    regex: "import MatrixRustSDK"
    message: "Only ElementCallMatrix may import MatrixRustSDK. Elsewhere, go through ElementCallMatrixTransport."
    severity: error
    # ElementCallMatrix exists to speak to the SDK. Tests are excluded too: the rule guards what a
    # host ends up linking, and a test bundle is not shipped, so a test asserting on ClientError
    # classification legitimately imports it.
    excluded: "(Sources/ElementCallMatrix|Tests)/.*"

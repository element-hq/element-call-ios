name: Tests

on:
  workflow_dispatch:
  push:
    # release/** as well as main: a release branch's tip is a commit nobody has tested otherwise,
    # and release.yml refuses to tag a commit without a green run here.
    branches: [main, release/**]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  # Which files changed, and can any of them alter what the tests job does? Ten seconds on Linux to
  # decide whether to spend ten minutes on macOS.
  #
  # This deliberately does NOT use a trigger-level `paths:` filter, which is what element-x-ios does
  # in compound-ios.yml. A trigger filter creates no workflow run at all, and scripts/release.sh
  # refuses to tag a commit unless a run of THIS workflow succeeded for it -- so a docs-only commit
  # would leave nothing to find and become unreleasable. A cheap job that always runs keeps the run
  # in existence and green, with the expensive job skipped inside it. Please do not "tidy" this into
  # a paths: filter.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
      # Needed for push events, where the filter compares refs with git. Full history because the
      # base can be an older commit on the default branch; the repository is a few megabytes, so
      # this is cheap. No LFS: nothing here reads a snapshot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `some-with-excludes` is not optional. The default, `some`, asks whether *some* file
          # matches *some* pattern -- and every file matches `**`, so `relevant` would be true for a
          # docs-only change and nothing would ever be skipped. This quantifier is the one that means
          # "matches a pattern and no negated pattern".
          predicate-quantifier: some-with-excludes
          # A blocklist, on purpose: `**` includes everything, and the exclusions below are the paths
          # known to be unable to change what the tests job does. Anything unrecognised therefore
          # counts as relevant, so a newly added load-bearing file errs towards being tested, where an
          # allowlist would silently stop testing it.
          #
          # Note what is NOT excluded, and must not be: Sources, Tests, Tools (Sourcery drives the
          # generated-test staleness check), Package.swift, Package.resolved, .swiftformat,
          # .swiftlint.yml, .gitattributes (it defines the LFS filter for the snapshot references)
          # and this workflow itself.
          filters: |
            relevant:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!LICENSE-*'
              - '!screenshot.png'
              - '!.editorconfig'
              - '!.gitignore'
              - '!codecov.yml'
              - '!renovate.json'
              - '!.swiftpm/**'
              - '!scripts/**'
              - '!.github/CODEOWNERS'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
              - '!.github/release.yml'
              - '!.github/workflows/release.yml'
              - '!.github/workflows/record-snapshots.yml'

  tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('tests-main-{0}', github.sha) || format('tests-{0}', github.ref) }}
      cancel-in-progress: true

    env:
      # Snapshot references are pinned to one device and OS: font rendering differs otherwise.
      # These three must match Tests/ElementCallTests/Support/SnapshotEnvironment.swift, which the
      # harness reads, and it fails loudly rather than silently if they drift.
      XCODE_APP: /Applications/Xcode_26.5.app
      SIMULATOR_NAME: iPhone SE (3rd generation)
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      SIMULATOR_LABEL: ElementCall Snapshots

    steps:
      # Snapshot references live in Git LFS, and without them every snapshot test fails on a
      # text pointer rather than an image.
      - uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1.2.5
        with:
          persist-credentials: false

      - name: Configure Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Install tools
        run: brew install sourcery swiftformat swiftlint

      # The package must never reach for the host application's world. SwiftLint carries the rules
      # that enforce it, at error severity, so this failing is the boundary breaking rather than a
      # style nit. Not --strict: the media layer arrived from the spike with sixteen force-unwrap
      # and large-tuple warnings that element-x-ios also carries, and promoting those to errors is
      # separate work from standing up continuous integration.
      - name: Lint
        run: |
          swiftformat --lint .
          swiftlint

      # Regenerated rather than trusted, then checked for drift: the committed file is what a
      # developer reads in a diff, so it must not go stale.
      - name: Generate preview tests
        working-directory: Tools/Sourcery
        run: sourcery --config PreviewTestsConfig.yml

      - name: Fail if the generated tests are stale
        run: git diff --exit-code -- Tests/ElementCallTests/GeneratedPreviewTests.swift

      - name: Create the snapshot simulator
        id: simulator
        run: |
          udid=$(xcrun simctl create "$SIMULATOR_LABEL" "$SIMULATOR_NAME" "$SIMULATOR_RUNTIME")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Two flags that are not optional, both of which fail in confusing ways when missed.
      #
      # `-ObjC` keeps libwebrtc's Objective-C categories from being dead-stripped out of the static
      # archive. Library targets never link, so a plain build passes without it and only the test
      # bundle dies, on launch, with an unrecognised selector.
      #
      # The destination is a concrete arm64 simulator by id. A generic one also builds Intel, for
      # which the media xcframework has no slice, and EXCLUDED_ARCHS on the command line does not
      # reach the targets SwiftPM generates.
      - name: Run tests
        run: |
          set -o pipefail && xcodebuild test \
            -scheme ElementCall-Package \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -testLanguage en -testRegion GB \
            OTHER_LDFLAGS='$(inherited) -ObjC' \
            -resultBundlePath Logs/ElementCallTests.xcresult \
            | xcbeautify --renderer github-actions

      - name: Zip artifacts
        if: failure()
        run: zip -r Logs/ElementCallTests.xcresult.zip Logs/ElementCallTests.xcresult/

      - name: Archive artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: Logs/ElementCallTests.xcresult.zip
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          xcode: true
          xcode_archive_path: Logs/ElementCallTests.xcresult
